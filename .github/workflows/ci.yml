name: SilvaPass Automated Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smart-contracts:
    name: Smart Contracts (Hardhat & Solidity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install Contract Dependencies
        run: |
          cd contracts
          npm ci

      - name: Compile Contracts
        run: |
          cd contracts
          npx hardhat compile

      - name: Run Contract Tests
        run: |
          cd contracts
          npx hardhat test

  backend-service:
    name: Backend Service (Python & FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: |
          PYTHONPATH=. pytest backend/tests

  frontend-client:
    name: Frontend Client (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  offline-evaluation-suite:
    name: Offline Evaluation Suite (Tracks A, B, C, D)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd contracts && npm ci && cd ..

      - name: Run Full Offline Evaluation
        run: |
          PYTHONPATH=. python scripts/run_evaluation_suite.py

